<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">How the course agent works</title><desc id="desc">Python sends messages and tool definitions to the Ollama model. A tool request goes to Python validation and execution, which reads lessons.json and returns the result to message history. The model can request more work or answer. Execution stops at five model turns or eight tool calls.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8194b1" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="830" rx="22" fill="#0e182c"/>
<g font-family="Arial,sans-serif"><text x="48" y="56" font-size="14" letter-spacing="2" fill="#79dfd1" font-weight="700">INSIDE THE COURSE ASSISTANT</text><text x="48" y="104" font-size="36" fill="#fff" font-weight="700">The model requests. Python executes.</text>
<text x="48" y="138" font-size="18" fill="#b9c9df">Follow the arrows to see how a question becomes a grounded response.</text>
<g fill="none" stroke="#8194b1" stroke-width="2" marker-end="url(#arrow)">
<path d="M360 240H447"/><path d="M750 240H837"/><path d="M990 302V340H600V377"/><path d="M750 445H837"/><path d="M450 445H363"/><path d="M990 507V537H600V567"/><path d="M600 660V704H50V240H59"/>
</g>
<rect x="60" y="186" width="300" height="116" rx="14" fill="#153449" stroke="#42738d"/><rect x="450" y="186" width="300" height="116" rx="14" fill="#2b264e" stroke="#8771ba"/><rect x="840" y="186" width="300" height="116" rx="14" fill="#322947" stroke="#8c6a9f"/>
<text x="82" y="214" font-size="12" letter-spacing="1.5" fill="#8bddf3">01 / PYTHON CONTROLLER</text><text x="82" y="247" font-size="23" font-weight="700" fill="#fff">Build messages</text><text x="82" y="279" font-size="16" fill="#c4d6e8">Instructions + question + history</text>
<text x="472" y="214" font-size="12" letter-spacing="1.5" fill="#cfbaff">02 / OLLAMA MODEL</text><text x="472" y="247" font-size="23" font-weight="700" fill="#fff">Select next action</text><text x="472" y="279" font-size="16" fill="#d3cbe6">Read context + tool definitions</text>
<text x="862" y="214" font-size="12" letter-spacing="1.5" fill="#e6bbf5">03 / MODEL RESPONSE</text><text x="862" y="247" font-size="23" font-weight="700" fill="#fff">Answer or tool request</text><text x="862" y="279" font-size="16" fill="#d3cbe6">Structured name + arguments</text>
<rect x="450" y="380" width="300" height="127" rx="14" fill="#23304a" stroke="#7795b9"/><text x="472" y="410" font-size="12" letter-spacing="1.5" fill="#bad6ff">04 / PYTHON BRANCH</text><text x="472" y="443" font-size="23" font-weight="700" fill="#fff">Inspect tool_calls</text><text x="472" y="477" font-size="16" fill="#c4d6e8">Choose execution or display</text>
<rect x="60" y="380" width="300" height="127" rx="14" fill="#203728" stroke="#508763"/><text x="82" y="410" font-size="12" letter-spacing="1.5" fill="#a0e4b3">NO TOOL REQUEST</text><text x="82" y="443" font-size="23" font-weight="700" fill="#fff">Display response</text><text x="82" y="477" font-size="16" fill="#c6dfcd">Answer or clarification; stop</text>
<rect x="840" y="380" width="300" height="127" rx="14" fill="#153d37" stroke="#4b9f8e"/><text x="862" y="410" font-size="12" letter-spacing="1.5" fill="#94efd9">TOOL REQUEST</text><text x="862" y="443" font-size="23" font-weight="700" fill="#fff">Check + execute</text><text x="862" y="477" font-size="16" fill="#c5e8df">get_lesson reads lessons.json</text>
<rect x="450" y="570" width="300" height="90" rx="14" fill="#153449" stroke="#42738d"/><text x="472" y="605" font-size="23" font-weight="700" fill="#fff">Append tool result</text><text x="472" y="635" font-size="16" fill="#c4d6e8">Data or error returns to history</text>
<text x="80" y="687" font-size="15" fill="#80dfd1">Continue with updated context</text>
<rect x="60" y="748" width="1080" height="42" rx="10" fill="#332d21"/><text x="82" y="775" font-size="16" fill="#f3d08b">Execution limits: 5 model turns · 8 tool calls per question · History resets for each new question</text>
</g></svg>